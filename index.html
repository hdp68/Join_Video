<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công cụ ghép video trực tuyến</title>
    <!-- Nhúng thư viện FFmpeg.wasm phiên bản ổn định -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 15px; background: #fafafa; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:disabled { background: #ddd; cursor: not-allowed; }
        #status { font-weight: bold; color: #333; margin-top: 10px; white-space: pre-line; }
        video { width: 100%; margin-top: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Ứng dụng ghép nối file Video MP4</h2>
    <div class="box">
        <p>Chọn các file video MP4 cần ghép (giữ Ctrl hoặc Shift để chọn nhiều file):</p>
        <input type="file" id="uploader" accept="video/mp4" multiple>
    </div>

    <button id="processBtn" onclick="mergeVideos()" disabled>Bắt đầu ghép video</button>
    <p id="status">Vui lòng chọn tối thiểu 2 file video MP4...</p>
    
    <div>
        <video id="outputVideo" controls style="display:none;"></video>
        <br>
        <a id="downloadLink" style="display:none; margin-top: 10px; display: inline-block;" download="merged_video.mp4">Tải video đã ghép về máy</a>
    </div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    const uploader = document.getElementById('uploader');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    uploader.addEventListener('change', () => {
        if (uploader.files.length >= 2) {
            processBtn.disabled = false;
            status.innerText = `Đã chọn ${uploader.files.length} file video. Sẵn sàng xử lý!`;
        } else {
            processBtn.disabled = true;
            status.innerText = 'Vui lòng chọn tối thiểu 2 file video MP4.';
        }
    });

    async function mergeVideos() {
        processBtn.disabled = true;
        outputVideo.style.display = 'none';
        downloadLink.style.display = 'none';

        try {
            if (!ffmpeg.isLoaded()) {
                status.innerText = "Đang tải bộ công cụ xử lý video (lần đầu có thể mất từ 10-30 giây)...";
                await ffmpeg.load();
            }

            const files = uploader.files;
            let filterComplex = "";
            let inputs = [];

            for (let i = 0; i < files.length; i++) {
                let fileName = `input${i}.mp4`;
                status.innerText = `Đang đọc file (${i + 1}/${files.length}): ${files[i].name}`;
                ffmpeg.FS('writeFile', fileName, await fetchFile(files[i]));
                inputs.push('-i', fileName);
                filterComplex += `[${i}:v:0][${i}:a:0]`;
            }

            filterComplex += `concat=n=${files.length}:v=1:a=1[outv][outa]`;

            status.innerText = "Đang tiến hành xử lý và ghép video (quá trình này mất vài phút tùy độ dài video)...";
            
            // Lệnh re-encode giúp ghép mọi định dạng video khác nhau an toàn tuyệt đối
            await ffmpeg.run(
                ...inputs, 
                '-filter_complex', filterComplex, 
                '-map', '[outv]', 
                '-map', '[outa]', 
                'output.mp4'
            );

            status.innerText = "Ghép video thành công!";
            
            const data = ffmpeg.FS('readFile', 'output.mp4');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            outputVideo.src = url;
            outputVideo.style.display = 'block';
            downloadLink.href = url;
            downloadLink.style.display = 'inline-block';
            processBtn.disabled = false;
        } catch (error) {
            console.error(error);
            status.innerText = "Lỗi xử lý: " + (error.message || "Không thể hoàn tất thao tác. Hãy thử video dung lượng nhỏ hơn.");
            processBtn.disabled = false;
        }
    }
</script>

</body>
</html>
