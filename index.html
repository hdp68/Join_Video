<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công cụ ghép video trực tuyến</title>
    <!-- Nhúng thư viện FFmpeg.wasm -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 650px; margin: auto; }
        .box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 15px; background: #fafafa; border-radius: 6px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 4px; width: 100%; }
        button:disabled { background: #ddd; cursor: not-allowed; }
        
        /* Panel hiển thị thông tin và danh sách file */
        .status-panel { background: #f1f3f5; border: 1px solid #ced4da; padding: 15px; border-radius: 6px; margin-top: 15px; display: none; }
        .status-panel h4 { margin-top: 0; color: #333; margin-bottom: 10px; font-size: 16px; }
        
        /* Thanh tiến trình Progress Bar */
        .progress-container { width: 100%; background: #e9ecef; border-radius: 4px; overflow: hidden; height: 20px; margin-bottom: 10px; }
        .progress-bar { width: 0%; height: 100%; background: #4CAF50; text-align: center; color: white; font-size: 12px; line-height: 20px; transition: width 0.2s; }
        
        /* Danh sách sắp xếp file */
        #fileListContainer { list-style: none; padding: 0; margin: 10px 0; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid #ddd; padding: 8px 12px; margin-bottom: 5px; border-radius: 4px; font-size: 14px; }
        .file-actions button { background: #007bff; padding: 4px 8px; font-size: 12px; width: auto; margin-left: 4px; }
        .file-actions button:disabled { background: #ccc; }

        video { width: 100%; margin-top: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Ứng dụng ghép nối file Video MP4</h2>
    <div class="box">
        <p>Chọn các file video MP4 cần ghép (giữ Ctrl hoặc Shift để chọn nhiều file):</p>
        <input type="file" id="uploader" accept="video/mp4" multiple>
    </div>

    <!-- Panel trạng thái và sắp xếp -->
    <div id="statusPanel" class="status-panel">
        <h4 id="mainStatus">Sẵn sàng...</h4>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar">0%</div>
        </div>
        <p style="margin: 5px 0; font-size: 14px;"><b>Sắp xếp thứ tự ghép video:</b></p>
        <ul id="fileListContainer"></ul>
        <div id="totalDuration" style="font-size: 14px; color: #333; margin-top: 10px;"></div>
    </div>

    <br>
    <button id="processBtn" onclick="mergeVideos()" disabled>Bắt đầu ghép video</button>
    
    <div>
        <video id="outputVideo" controls style="display:none;"></video>
        <br>
        <a id="downloadLink" style="display:none; margin-top: 10px; display: inline-block;" download="merged_video.mp4">Tải video đã ghép về máy</a>
    </div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    const uploader = document.getElementById('uploader');
    const processBtn = document.getElementById('processBtn');
    const statusPanel = document.getElementById('statusPanel');
    const mainStatus = document.getElementById('mainStatus');
    const progressBar = document.getElementById('progressBar');
    const fileListContainer = document.getElementById('fileListContainer');
    const totalDurationDiv = document.getElementById('totalDuration');
    const outputVideo = document.getElementById('outputVideo');
    const downloadLink = document.getElementById('downloadLink');

    let currentFiles = []; // Mảng lưu trữ danh sách file kèm thời lượng

    function getVideoDuration(file) {
        return new Promise((resolve) => {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.onloadedmetadata = function() {
                window.URL.revokeObjectURL(video.src);
                resolve(video.duration);
            }
            video.src = URL.createObjectURL(file);
        });
    }

    uploader.addEventListener('change', async () => {
        const files = Array.from(uploader.files);
        if (files.length >= 2) {
            processBtn.disabled = false;
            statusPanel.style.display = 'block';
            mainStatus.innerText = `Đã chọn ${files.length} file video. Đang phân tích...`;
            
            currentFiles = [];
            for (let file of files) {
                let duration = await getVideoDuration(file);
                currentFiles.push({ file, duration });
            }

            renderFileList();
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';
        } else {
            processBtn.disabled = true;
            statusPanel.style.display = 'none';
            currentFiles = [];
        }
    });

    // Hàm hiển thị danh sách giao diện sắp xếp
    async function renderFileList() {
        fileListContainer.innerHTML = '';
        let totalSec = 0;

        currentFiles.forEach((item, index) => {
            totalSec += item.duration;
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <span><b>#${index + 1}</b> ${item.file.name} (${item.duration.toFixed(2)}s)</span>
                <div class="file-actions">
                    <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''}>⬆️ Lên</button>
                    <button onclick="moveItem(${index}, 1)" ${index === currentFiles.length - 1 ? 'disabled' : ''}>⬇️ Xuống</button>
                </div>
            `;
            fileListContainer.appendChild(li);
        });

        totalDurationDiv.innerHTML = `<b>Tổng độ dài các file nối:</b> <span style="color: #d9534f;">${totalSec.toFixed(2)} giây</span>`;
        mainStatus.innerText = `Sẵn sàng ghép ${currentFiles.length} file video theo thứ tự trên!`;
    }

    // Hàm thay đổi vị trí file lên hoặc xuống
    window.moveItem = function(index, direction) {
        const newIndex = index + direction;
        if (newIndex >= 0 && newIndex < currentFiles.length) {
            const temp = currentFiles[index];
            currentFiles[index] = currentFiles[newIndex];
            currentFiles[newIndex] = temp;
            renderFileList();
        }
    }

    async function mergeVideos() {
        processBtn.disabled = true;
        outputVideo.style.display = 'none';
        downloadLink.style.display = 'none';

        try {
            if (!ffmpeg.isLoaded()) {
                mainStatus.innerText = "Đang tải bộ công cụ xử lý video (vui lòng chờ trong giây lát)...";
                await ffmpeg.load();
            }

            let filterComplex = "";
            let inputs = [];

            for (let i = 0; i < currentFiles.length; i++) {
                let fileName = `input${i}.mp4`;
                mainStatus.innerText = `Đang nạp file (${i + 1}/${currentFiles.length}): ${currentFiles[i].file.name}`;
                ffmpeg.FS('writeFile', fileName, await fetchFile(currentFiles[i].file));
                inputs.push('-i', fileName);
                filterComplex += `[${i}:v:0][${i}:a:0]`;
            }

            filterComplex += `concat=n=${currentFiles.length}:v=1:a=1[outv][outa]`;

            // Lắng nghe tiến trình render từ ffmpeg
            ffmpeg.setProgress(({ ratio }) => {
                let percent = Math.max(0, Math.min(100, Math.round(ratio * 100)));
                progressBar.style.width = percent + '%';
                progressBar.innerText = percent + '%';
                mainStatus.innerText = `Processing = ${percent}%`;
            });

            mainStatus.innerText = "Đang tiến hành ghép nối video...";
            
            await ffmpeg.run(
                ...inputs,
